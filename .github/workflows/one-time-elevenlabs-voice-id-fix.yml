name: One-time ElevenLabs Voice ID Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Voice ID input
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/settings/voice-settings.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''                                        <div className="flex flex-col gap-1">\n                                            <label className="menu-desc ml-1">默认音色 (Default Voice) 或 自定义 Voice ID</label>\n                                            <div className="flex flex-col gap-2">\n                                                <div className="flex gap-2">\n                                                    {manualVoiceIds[config.id] ? ('''
          new = '''                                        <div className="flex flex-col gap-1">\n                                            <label className="menu-desc ml-1">{config.provider === "ElevenLabs" ? "Voice ID" : "默认音色 (Default Voice) 或 自定义 Voice ID"}</label>\n                                            <div className="flex flex-col gap-2">\n                                                <div className="flex gap-2">\n                                                    {config.provider === "ElevenLabs" ? (\n                                                        <Input\n                                                            type="text"\n                                                            value={config.defaultVoice}\n                                                            onChange={(e) => updateConfig(config.id, { defaultVoice: e.target.value })}\n                                                            placeholder="输入或粘贴 ElevenLabs Voice ID"\n                                                            className="flex-1"\n                                                        />\n                                                    ) : manualVoiceIds[config.id] ? ('''
          if old not in s:
              raise SystemExit('Voice ID block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/settings/voice-settings.tsx
          git rm .github/workflows/one-time-elevenlabs-voice-id-fix.yml
          git commit -m "fix: make ElevenLabs Voice ID directly editable"
          git push
